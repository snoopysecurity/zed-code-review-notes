id = "code-review-notes-lsp"
name = "Code Review Notes"
version = "0.2.0"
schema_version = 1
authors = ["snoopysecurity <samsanoop@outlook.com>"]
description = "Keep code review notes alongside your code and import security findings from SARIF reports."
repository = "https://github.com/snoopysecurity/zed-code-review-notes"

[language_servers.code-review-notes]
name = "Code Review Notes"
# Has to match each language's `name` exactly, no wildcard support.
# Uninstalled extension languages are ignored. "Plain Text" covers files
# without a language definition, including `.sarif` when selected in Zed.
languages = [
  # built in
  "C", "C++", "CSS", "Diff", "Env", "Git Commit", "Go", "Go Mod", "Go Work",
  "JavaScript", "JSON", "JSONC", "Markdown", "Plain Text", "Python", "Rust",
  "Shell Script", "TSX", "TypeScript", "YAML",
  # extensions
  "Alex", "Astro", "Cabal", "CSharp", "Dart", "Docker Compose", "Dockerfile",
  "EEx", "Elixir", "Elm", "ERB", "Erlang", "GLSL", "Gradle", "Gradle KTS",
  "GraphQL", "Groovy", "Haskell", "HCL", "HEEx", "HTML", "HTML+ERB", "Java",
  "JS+ERB", "Kotlin", "Literate Haskell", "Lua", "Make", "Nix", "OCaml",
  "OCaml Interface", "PHP", "Properties", "Proto", "RBS", "Reason", "Ruby",
  "Scala", "Solidity", "SQL", "Svelte", "Swift", "Terraform", "Terraform Vars",
  "TOML", "Vue.js", "XML", "YAML+ERB", "Yul", "Zig",
]
# All supported languages require an explicit `language_servers` setting.
# Keep this list identical to `languages`.
opt_in_languages = [
  "C", "C++", "CSS", "Diff", "Env", "Git Commit", "Go", "Go Mod", "Go Work",
  "JavaScript", "JSON", "JSONC", "Markdown", "Plain Text", "Python", "Rust",
  "Shell Script", "TSX", "TypeScript", "YAML",
  "Alex", "Astro", "Cabal", "CSharp", "Dart", "Docker Compose", "Dockerfile",
  "EEx", "Elixir", "Elm", "ERB", "Erlang", "GLSL", "Gradle", "Gradle KTS",
  "GraphQL", "Groovy", "Haskell", "HCL", "HEEx", "HTML", "HTML+ERB", "Java",
  "JS+ERB", "Kotlin", "Literate Haskell", "Lua", "Make", "Nix", "OCaml",
  "OCaml Interface", "PHP", "Properties", "Proto", "RBS", "Reason", "Ruby",
  "Scala", "Solidity", "SQL", "Svelte", "Swift", "Terraform", "Terraform Vars",
  "TOML", "Vue.js", "XML", "YAML+ERB", "Yul", "Zig",
]
